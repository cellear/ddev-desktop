name: ddev-desktop

# The command goes to ~/.ddev/commands/host/ so `ddev desktop` works from
# any directory, not only the project this add-on was installed from.
global_files:
  - commands/host/desktop

ddev_version_constraint: '>= v1.23.0'

post_install_actions:
  - |
    #ddev-description:Explain the next step
    echo "Installed. Run 'ddev desktop' from anywhere to open DDEV Desktop."
    echo "The first run downloads the daemon binary into ~/.ddev-desktop/bin."
    echo "(No 'ddev restart' is needed: this add-on only adds a host command.)"

removal_actions:
  - |
    #ddev-description:Remove the downloaded daemon binary (settings are kept)
    rm -rf "$HOME/.ddev-desktop/bin"
